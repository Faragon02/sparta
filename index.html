<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Black+And+White+Picture&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap');

        * {
            font-family: "Anton", serif;
        }

        .mytitle {
            height: 250px;
            background-color: skyblue;
            background-image: url('https://i.namu.wiki/i/yS_K97fu9FTAo9b9NAWB6PMhWoSYptmEtvYfKC7MgXL7WzZUrGezet216nkI0VxaMm8KazV98ub2XFYv_VTsM6MZojmLb0KmrDUBjuloPbnmKtAz3Rdil7kPduMKp08tRffb1uk9g_ehT4fuyZigaw.webp');
            background-position: center;
            background-size: cover;
            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mytitle>button {
            width: 150px;
            height: 50px;
            background-color: transparent;
            color: white;
            border-top: 1px solid white;
            border-radius: 5px;

            margin-top: 20px;
        }

        .mycards {
            width: 1200px;

            margin: 30px auto 0px auto;
        }

        .mypostingbox {
            width: 500px;
            margin: 30px auto 0px auto;
            padding: 20px;
            box-shadow: 0px 0px 3px 0px blue;
        }

        .mybtn {
            width: 300px;

            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;

            margin-bottom: 5px;
        }

        .mybtn>button {
            margin-right: 5px;
        }
    </style>
    <script type="module">
        // Firebase SDK 라이브러리 가져오기
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";


        // Firebase 구성 정보 설정
        const firebaseConfig = {
            // For Firebase JS SDK v7.20.0 and later, measurementId is optional
            apiKey: "AIzaSyC54ag5p7OFYT8vaMqHWjI1BGKldR1zP84",
            authDomain: "sparta-42d48.firebaseapp.com",
            projectId: "sparta-42d48",
            storageBucket: "sparta-42d48.firebasestorage.app",
            messagingSenderId: "944449923606",
            appId: "1:944449923606:web:38cc8a9b00df542fc22337",
            measurementId: "G-QRKPJ3RFC9"
        };

        // Firebase 인스턴스 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        //DB에 삽입
        $("#postingbtn").click(async function () {

            let input_img = $('#image').val()
            let input_title = $('#title').val()
            let input_content = $('#content').val()
            let input_date = $('#date').val()
            let doc = {
                'image': input_img,
                'title': input_title,
                'content': input_content,
                'date': input_date
            };
            await addDoc(collection(db, "albums"), doc);
            alert('저장 완료!');
            window.location.reload();
        });

        $("#savebtn").click(async function () {
            $('#postingbox').toggle()
        });

        //url Test
        let url = "http://spartacodingclub.shop/sparta_api/seoulair";
        fetch(url).then(res => res.json()).then(data => {

            let mise = data['RealtimeCityAir']['row'][0]['IDEX_NM'];
            $('#msg').text(mise)
        });
        //DB에서 불러오기
        let docs = await getDocs(collection(db, "albums"));
        docs.forEach((doc) => {
            let row = doc.data();

            let input_img = row['image']
            let input_title =row['title']
            let input_content =row['content']
            let input_date = row['date']

            let temp_html = `
                <div class="col">
                <div class="card h-100">
                    <img src="${input_img}"
                        class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">${input_title}</h5>
                        <p class="card-text">${input_content}</p>
                    </div>
                    <div class="card-footer">
                        <small class="text-body-secondary">${input_date}</small>
                    </div>
                </div>
            </div>`
            $('#card').append(temp_html)
        });
    </script>
</head>

        <p>현재 서울의 미세먼지: <span id="msg">나쁨</span></p>
        <button id="savebtn">추억 저장하기</button>
    </div>
    <div class="mypostingbox" id="postingbox">

        </div>

        </div>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="content" placeholder="앨범 내용">
            <label for="floatingInput">앨범 내용</label>
        </div>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="date" placeholder="앨범 날짜">
            <label for="floatingInput">앨범 날짜</label>
        </div>
        <div class="mybtn">
            <button id="postingbtn" type="button" class="btn btn-dark">기록하기</button>
            <button type="button" class="btn btn-outline-dark">닫기</button>
        </div>
    </div>
